server:
  port: 8085

sunshine:
  db:
    database: sunshine_mall_pay

spring:
  application:
    name: pay-service

mq:
  enabled: true

distributed-id:
  datacenter-id: 1
  worker-id: 1


feign:
  okhttp:
    enabled: true
  sentinel:
    enabled: true

# RocketMQ 基础配置（生产者组名以服务维度配置）。name-server 由 Nacos 的 shared-rocketmq.yaml 提供。
rocketmq:
  producer:
    group: pay-service-producer-group

# 支付渠道配置（占位，后续由你在Nacos或本地配置具体密钥）
alipay:
  easy:
    enabled: true
    protocol: https
    gatewayHost: openapi-sandbox.dl.alipaydev.com
    sign-type: RSA2
    app-id: "9021000157633942"
    merchant-private-key: ""
    alipay-public-key: ""
    notify-url: http://localhost:8085/pay/api/pay/notify/alipay

  wechat:
    enabled: false
    mch-id: ""
    app-id: ""
    merchant-private-key: ""
    serial-no: ""
    api-v3-key: ""
    notify-url: http://localhost:8085/pay/api/pay/notify/wechat
