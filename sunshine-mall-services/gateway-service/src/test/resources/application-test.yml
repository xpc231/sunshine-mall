server:
  port: 0

spring:
  application:
    name: gateway-service-test

  cloud:
    nacos:
      discovery:
        enabled: false

    gateway:
      routes:
        - id: test-route
          uri: http://localhost:9999
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1

  data:
    redis:
      host: localhost
      port: 6379
      database: 1

jwt:
  # 测试环境密钥（32以上）
  secret: test-secret-key-for-jwt-min-32-bytes-required-here!!
  expiration: 7200000

logging:
  level:
    root: INFO
    com.xpcjsu.sunshinemall: DEBUG
